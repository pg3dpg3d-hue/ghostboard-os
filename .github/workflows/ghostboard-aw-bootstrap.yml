name: Ghostboard gh-aw bootstrap

on:
  push:
    branches:
      - autopilot/autonomous-factory-v1
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_AW_SAFE_MODE: "1"

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autopilot/autonomous-factory-v1
          fetch-depth: 0
      - name: Install gh-aw
        uses: github/gh-aw/actions/setup-cli@main
      - name: Compile and validate Ghostboard agentic workflow
        run: |
          set -euo pipefail
          gh aw compile ghostboard-autopilot
          gh aw compile --validate
      - name: Upload generated lock workflow
        uses: actions/upload-artifact@v4
        with:
          name: ghostboard-autopilot-lock
          path: .github/workflows/ghostboard-autopilot.lock.yml
          if-no-files-found: error
          retention-days: 1
