name: Ghostboard Pi 5 software checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debian-x11:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 20
    steps:
      - name: Install test environment
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-tk nodejs npm xvfb xauth xdotool scrot wmctrl xterm
      - uses: actions/checkout@v4
      - name: Python and protocol regression tests
        run: |
          npm ci --prefix spatial --ignore-scripts --no-audit --no-fund
          python3 tests/test-pi5.py
          python3 tests/test-hand-tracking.py
          node tests/test-mcp-regressions.js
          node tests/test-mcp.js
          node --check spatial/app.js
          python3 -m compileall -q runtime install/pi5.py install/hand-deps.py
          bash -n image/build-image.sh install/ghostboard-pi5.sh
      - name: Real X11 integration
        run: |
          xvfb-run -a -s '-screen 0 800x480x24 -nolisten tcp' node tests/test-mcp.js
          xvfb-run -a -s '-screen 0 800x480x24 -nolisten tcp' python3 tests/test-desktop-live.py
      - name: Native control center layout
        run: xvfb-run -a -s '-screen 0 800x480x24 -nolisten tcp' python3 tests/test-control-center.py
      - name: Package availability on Debian 13
        run: |
          python3 install/pi5.py --dry-run > /tmp/ghostboard-plan.json
          python3 -c "import json,subprocess; p=json.load(open('/tmp/ghostboard-plan.json')); subprocess.run(['apt-get','--simulate','install',*p['packages']],check=True)"
