; ---------------------------------------------------------------------------
;  GHOSTBOARD — firmware de la carte compagnon ESP32
;
;  Build reproductible : la plateforme et les bibliothèques sont épinglées.
;  Sur un second poste, `pio run` doit produire le même binaire.
;
;      pio run                 compile
;      pio run -t upload       compile + flash (port auto-détecté)
;      pio run -t upload -e esp32-usb   force le port USB natif (ESP32-S3/C3)
;
;  Côté deck, on passe plutôt par :  ghost-bruce flash
; ---------------------------------------------------------------------------
[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
; Bibliothèques épinglées — pas de résolution "dernière version" au build.
lib_deps =
    olikraus/U8g2@^2.35.30
    adafruit/Adafruit NeoPixel@^1.12.3
build_flags =
    ; Le firmware injecte des trames 802.11 brutes : il faut autoriser
    ; l'API esp_wifi_80211_tx (désactivée par défaut côté sanity-check).
    -D CONFIG_ESP32_WIFI_TX_BUFFER_TYPE=0

; --- Carte par défaut : ESP32 classique (WROOM), UART CP210x/CH340 -----------
[env:esp32dev]
board = esp32dev

; --- Cartes à USB natif (ESP32-S3 / C3, écran embarqué type Bruce) -----------
[env:esp32-usb]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
